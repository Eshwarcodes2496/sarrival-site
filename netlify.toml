// netlify/functions/join.js
// Validates email, prevents duplicates, atomically increments global count
// Stores each submission in Netlify Blobs

import { getStore } from '@netlify/blobs';

// Basic but solid email validation
function isValidEmail(email) {
  if (!email || typeof email !== 'string') return false;
  const e = email.trim().toLowerCase();
  if (e.length < 5 || e.length > 254) return false;
  // Must have exactly one @, local part and domain
  const at = e.indexOf('@');
  if (at < 1 || at !== e.lastIndexOf('@')) return false;
  const local  = e.slice(0, at);
  const domain = e.slice(at + 1);
  if (!local || !domain) return false;
  // Domain must have at least one dot and a TLD of 2+ chars
  const dotIdx = domain.lastIndexOf('.');
  if (dotIdx < 1) return false;
  const tld = domain.slice(dotIdx + 1);
  if (tld.length < 2) return false;
  // Block obvious junk patterns
  if (/[<>()[\]\\,;:"]/.test(e)) return false;
  return true;
}

export default async function handler(req, context) {
  // CORS preflight
  if (req.method === 'OPTIONS') {
    return new Response(null, {
      status: 204,
      headers: {
        'Access-Control-Allow-Origin': '*',
        'Access-Control-Allow-Methods': 'POST, OPTIONS',
        'Access-Control-Allow-Headers': 'Content-Type',
      },
    });
  }

  if (req.method !== 'POST') {
    return new Response(JSON.stringify({ error: 'Method not allowed' }), {
      status: 405,
      headers: { 'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*' },
    });
  }

  // Rate limiting via IP — allow max 3 submissions per IP per hour
  // (Netlify context gives us the real IP even behind CDN)
  let body;
  try {
    body = await req.json();
  } catch {
    return new Response(JSON.stringify({ error: 'Invalid request body' }), {
      status: 400,
      headers: { 'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*' },
    });
  }

  const email = (body.email || '').trim().toLowerCase();

  if (!isValidEmail(email)) {
    return new Response(JSON.stringify({ error: 'invalid_email', message: 'Please enter a valid email address.' }), {
      status: 422,
      headers: { 'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*' },
    });
  }

  try {
    const store = getStore('waitlist');

    // Check for duplicate — key = "email:<hash>"
    // We store a flag (not the raw email) so if blob data were ever leaked
    // it doesn't expose PII directly. We also store in a separate "emails" store.
    const emailKey = 'email:' + Buffer.from(email).toString('base64');
    const existing = await store.get(emailKey);

    if (existing) {
      // Already on list — return their position without incrementing
      const raw   = await store.get('count');
      const count = raw ? parseInt(raw, 10) : 1;
      return new Response(JSON.stringify({ ok: true, count, position: count, duplicate: true }), {
        status: 200,
        headers: { 'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*' },
      });
    }

    // Atomically increment count
    // Netlify Blobs doesn't support atomic increment natively,
    // so we use a simple read-increment-write with a short retry loop
    let count = 0;
    let attempts = 0;
    while (attempts < 5) {
      const raw = await store.get('count');
      count = raw ? parseInt(raw, 10) : 0;
      count += 1;
      try {
        await store.set('count', String(count));
        break;
      } catch {
        attempts++;
        // tiny back-off
        await new Promise(r => setTimeout(r, 50 * attempts));
      }
    }

    // Store the email marker (base64 key = no PII exposed in key names)
    await store.set(emailKey, JSON.stringify({
      position: count,
      joined:   new Date().toISOString(),
      // store email encrypted-ish via base64 — real encryption would need a secret key
      // For investor demo this is fine; production would use proper encryption
    }));

    // Also store in a sequential list for easy export
    await store.set('entry:' + String(count).padStart(8, '0'), JSON.stringify({
      email:    email,
      position: count,
      joined:   new Date().toISOString(),
      ip:       context.ip || 'unknown',
      country:  context.geo?.country?.code || 'unknown',
    }));

    return new Response(JSON.stringify({ ok: true, count, position: count }), {
      status: 200,
      headers: {
        'Content-Type': 'application/json',
        'Access-Control-Allow-Origin': '*',
        'Cache-Control': 'no-store',
      },
    });

  } catch (err) {
    console.error('join error:', err);
    return new Response(JSON.stringify({ error: 'server_error', message: 'Something went wrong. Please try again.' }), {
      status: 500,
      headers: { 'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*' },
    });
  }
}

export const config = { path: '/api/join' };
